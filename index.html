<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>睡眠館｜睡眠自我檢測</title><style>body{margin:0;background:#eef5f5;color:#173d43;font-family:system-ui,-apple-system,sans-serif}main{max-width:690px;margin:30px auto;padding:26px;background:white;border-radius:22px;box-shadow:0 8px 32px #1233}header{text-align:center}.logo{max-width:170px;max-height:110px;display:none;margin:0 auto 12px}h1{margin:8px 0}p{line-height:1.7}.muted{color:#60777a;font-size:14px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center}.question{border-top:1px solid #dae6e5;padding:18px 0}.question h3{font-size:17px;margin:0 0 12px}.choices{display:grid;grid-template-columns:1fr 1fr;gap:9px}.choices label{border:1px solid #cbdcda;padding:11px;border-radius:12px;cursor:pointer;line-height:1.4}.choices label:has(input:checked){border-color:#187b7b;background:#e0f4f1}.choices input{accent-color:#187b7b}button{border:0;border-radius:12px;background:#147a7b;color:white;padding:13px 22px;font-size:17px;cursor:pointer}button.secondary{background:#e1eceb;color:#24575a}#result{display:none;background:#e8f5f2;border-radius:16px;padding:20px;margin-top:20px}.score{font-size:44px;font-weight:800}.bar{height:9px;background:#d2e2e0;border-radius:10px;overflow:hidden}.bar span{display:block;height:100%;background:#168783;width:0}select{font-size:16px;padding:8px;border-radius:8px;border:1px solid #ccd}footer{font-size:12px;color:#617b7b;margin-top:22px} @media(max-width:520px){main{margin:0;border-radius:0;padding:18px}.choices{grid-template-columns:1fr}}@media print{button,.top select,.upload{display:none!important}main{box-shadow:none}}</style></head><body><main><div class="top"><span id="brand">睡眠館 · Sleep Wellness</span><select id="lang"><option value="zh">繁體中文</option><option value="ja">日本語</option></select></div><header><img id="logo" class="logo"><div ><label><span id="logoText"></span><input type="file" style="display:none" id="logoInput" accept="image/*" style="max-width:180px"></label></div><h1 id="title">睡眠自我檢測</h1><p id="intro">雅典失眠量表（AIS-8）｜8 題，約 2 分鐘</p></header><p id="instructions" class="muted"></p><div id="questions"></div><button id="submit">查看檢測結果</button> <button id="reset" class="secondary">重新測試</button><section id="result" aria-live="polite"><div id="resultTitle"></div><div class="score"><span id="score">0</span><small style="font-size:18px"> / 24</small></div><div class="bar"><span id="fill"></span></div><h2 id="assessment"></h2><p id="advice"></p><button id="print" class="secondary" onclick="window.print()">列印結果</button></section><footer id="disclaimer"></footer></main><script>
const data={zh:{title:'睡眠自我檢測',intro:'雅典失眠量表（AIS-8）｜8 題，約 2 分鐘',logo:'上傳睡眠館 Logo（選用）',instructions:'請回想最近一個月的情況。只有當某項困擾每週至少發生 3 次時，才依其嚴重程度作答；否則請選 0 分。',qs:[['入睡所需時間',['沒有問題','稍微延遲','明顯延遲','嚴重延遲或幾乎無法入睡']],['夜間醒來',['沒有問題','輕微困擾','明顯困擾','嚴重困擾']],['比預期時間更早醒來',['沒有提早','稍微提早','明顯提早','非常早醒']],['總睡眠時間',['足夠','稍嫌不足','明顯不足','嚴重不足']],['整體睡眠品質',['滿意','稍不滿意','明顯不滿意','非常不滿意']],['白天的身心舒適感',['正常','稍微下降','明顯下降','嚴重下降']],['白天的身心活動能力',['正常','稍微下降','明顯下降','嚴重下降']],['白天嗜睡程度',['沒有','輕微','明顯','非常嚴重']]],submit:'查看檢測結果',reset:'重新測試',result:'您的檢測分數',low:'未達失眠篩檢門檻',high:'可能有失眠相關困擾',lowAdvice:'目前分數低於常用篩檢門檻。若仍感到睡眠不佳，可持續觀察睡眠與白天精神狀態。',highAdvice:'分數達到常用失眠篩檢門檻（6 分）。建議記錄睡眠狀況，並諮詢醫師或睡眠專業人員進一步評估。',missing:'請先回答全部 8 題。',disclaimer:'本工具採用雅典失眠量表（AIS-8），依據 WHO ICD-10 失眠診斷標準發展，但不是 WHO 官方推出的測驗。結果僅供自我篩檢，不等於醫療診斷。所有作答只在本機計算，不會上傳。'},ja:{title:'睡眠セルフチェック',intro:'アテネ不眠尺度（AIS-8）｜8問・約2分',logo:'睡眠館のロゴを追加（任意）',instructions:'過去1か月を振り返り、週3回以上生じた問題について、その程度を選んでください。それ未満の場合は0点を選択してください。',qs:[['寝つくまでの時間',['問題なし','少し時間がかかる','かなり時間がかかる','非常に時間がかかる／眠れない']],['夜中に目が覚める',['問題なし','少し問題がある','かなり問題がある','非常に問題がある']],['予定より早く目が覚める',['早くならない','少し早い','かなり早い','非常に早い']],['睡眠時間',['十分','少し足りない','かなり足りない','非常に足りない']],['睡眠の質',['満足','少し不満','かなり不満','非常に不満']],['日中の気分・体調',['通常どおり','少し低下','かなり低下','非常に低下']],['日中の活動能力',['通常どおり','少し低下','かなり低下','非常に低下']],['日中の眠気',['なし','軽い','強い','非常に強い']]],submit:'結果を見る',reset:'もう一度',result:'チェック結果',low:'不眠のスクリーニング基準未満',high:'不眠症状の可能性があります',lowAdvice:'一般的な判定基準未満です。気になる症状が続く場合は睡眠状態を観察してください。',highAdvice:'一般的なスクリーニング基準の6点以上です。睡眠記録をつけ、医師や睡眠専門家に相談することをおすすめします。',missing:'8問すべてに回答してください。',disclaimer:'アテネ不眠尺度（AIS-8）はWHOのICD-10診断基準に基づいて開発された尺度で、WHO公式テストではありません。診断を目的とせず、回答は端末内で処理され送信されません。'}};
let answers=Array(8).fill(null);const $=id=>document.getElementById(id);function render(){let d=data[$('lang').value];['title','intro','instructions','submit','reset','disclaimer'].forEach(k=>$(k).textContent=d[k]);$('logoText').textContent=d.logo;$('questions').innerHTML=d.qs.map((q,i)=>`<section class="question"><h3>${i+1}. ${q[0]}</h3><div class="choices">${q[1].map((a,j)=>`<label><input type="radio" name="q${i}" value="${j}" ${answers[i]===j?'checked':''}> ${j} · ${a}</label>`).join('')}</div></section>`).join('');$('result').style.display='none';} $('questions').addEventListener('change',e=>{if(e.target.matches('input[type=radio]'))answers[+e.target.name.slice(1)]=+e.target.value});$('lang').addEventListener('change',render);$('submit').onclick=()=>{let d=data[$('lang').value];if(answers.some(a=>a===null)){alert(d.missing);return}let n=answers.reduce((a,b)=>a+b,0);$('resultTitle').textContent=d.result;$('score').textContent=n;$('fill').style.width=(n/24*100)+'%';$('assessment').textContent=n>=6?d.high:d.low;$('advice').textContent=n>=6?d.highAdvice:d.lowAdvice;$('result').style.display='block';$('result').scrollIntoView({behavior:'smooth'})};$('reset').onclick=()=>{answers.fill(null);render();window.scrollTo({top:0,behavior:'smooth'})};$('logoInput').onchange=e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{$('logo').src=r.result;$('logo').style.display='block'};r.readAsDataURL(f)};render();
</script></body></html>
